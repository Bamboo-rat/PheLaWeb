# ===================================================================
# TEST CONFIGURATION - uses H2 in-memory database
# ===================================================================

# H2 In-Memory Database (replaces MySQL for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Server Port
server.port=8080

# JWT - dummy key for test
jwt.signer-key=testSecretKeyForTestingPurposesOnlyDoNotUseInProduction1234567890

# Application URLs
app.base-url=http://localhost:8080
frontend.customer-url=http://localhost:3000
frontend.admin-url=http://localhost:3001

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Mail - dummy values for test (won't actually send)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary - dummy values for test
cloudinary.cloud-name=test-cloud
cloudinary.api-key=123456789
cloudinary.api-secret=test-secret

# SendGrid - dummy
SENDGRID_API_KEY=SG.test

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# PayOS - dummy values for test
payos.client-id=test-client-id
payos.api-key=test-api-key
payos.checksum-key=test-checksum-key
payos.return-url=http://localhost:3000/payment-return
payos.cancel-url=http://localhost:3000/payment-cancel
