# ===================================================================
# DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# MySQL-specific: Ensure zero date values (e.g. 0000-00-00) are converted to null instead of causing JDBC exceptions
spring.datasource.hikari.data-source-properties.zeroDateTimeBehavior=convertToNull

# Hibernate Configuration for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Port
server.port=${PORT:8080}

# JWT Secret Key
jwt.signer-key=${JWT_SIGNER_KEY}

spring.main.lazy-initialization=true

# ===================================================================
# OTHER CONFIGURATIONS
# ===================================================================
# Application Configuration
app.base-url=${APP_BASE_URL:http://localhost:8080}

frontend.customer-url=${FRONTEND_CUSTOMER_URL:http://localhost:3001}
frontend.admin-url=${FRONTEND_ADMIN_URL:http://localhost:3000}


# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:8080/api/payment/payment-return}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:8080/api/payment/payment-cancel}